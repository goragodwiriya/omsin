<div class="card-groups">
  <header>
    <div>
      <h1 class="icon-find" data-i18n>{LNG_Custom Report}</h1>
      <p data-i18n>{LNG_Income and Expenditure summary}</p>
    </div>
    <div>
      <a class="btn btn-primary icon-billing" href="/omsin" data-i18n>{LNG_Recording} {LNG_Income}/{LNG_Expense}</a>
    </div>
  </header>
  <div class="content-body">
    <div class="tablebody">
      <table class="table border fullwidth" data-table="omsinSearch" data-source="api/omsin/search" data-default-sort="create_date desc" data-page-size="30"
             data-search-columns="comment" data-action-params="wallet,tag,status,from,to" data-show-checkbox="true" data-show-footer="true"
             data-actions='{"delete":"Delete"}' data-action-url="api/omsin/search/action" data-row-actions='{
                "edit": {
                  "title": "Edit",
                  "className": "btn btn-success icon-edit",
                  "condition": "editable == 1"
                }
              }'>
        <thead>
          <tr>
            <th data-field="create_date" data-sort="create_date" data-format="datetime" data-filter="true" data-type="daterange" data-range-names="from,to"
                data-range-presets="today,7d,30d,thismonth,lastmonth" data-label="Date" data-i18n>{LNG_Date}</th>
            <th data-field="tag" data-sort="tag" data-filter="true" data-type="select" data-show-all="true" data-all-value="" class="center" data-cell-class="center nowrap" data-format="lookup" data-i18n>{LNG_Tag}</th>
            <th data-field="wallet" data-sort="wallet" data-filter="true" data-type="select" data-show-all="true" data-all-value="" class="center" data-cell-class="center nowrap" data-format="lookup" data-i18n>{LNG_Wallet}</th>
            <th data-field="comment" data-i18n>{LNG_Annotation}</th>
            <th data-field="amount_text" data-sort="income" class="center" data-cell-class="right"
                data-template="<span class='${amount_class}'>${amount_text}</span>" data-i18n>{LNG_Amount}</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr>
            <td colspan="4" class="right" data-i18n>{LNG_Total}</td>
            <td class="right" data-field="net" data-aggregate="sum" data-format="currency"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>
