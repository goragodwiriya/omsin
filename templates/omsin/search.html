<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <div class="card-groups">
        <header>
          <div>
            <h1 class="icon-find" data-i18n>{LNG_Custom Report}</h1>
            <p data-i18n>{LNG_Income and Expenditure summary}</p>
          </div>
          <div>
            <a class="btn btn-primary icon-billing" href="/omsin" data-i18n>{LNG_Recording} {LNG_Income}/{LNG_Expense}</a>
          </div>
        </header>
        <div class="content-body">
          <form data-table-filter="omsinSearch" class="table_nav">
            <div>
              <label for="pageSize" data-i18n>{LNG_Show}</label>
              <span class="form-control">
                <select name="pageSize">
                  <option value="10" data-i18n>10 {LNG_entries}</option>
                  <option value="30" selected data-i18n>30 {LNG_entries}</option>
                  <option value="50" data-i18n>50 {LNG_entries}</option>
                  <option value="100" data-i18n>100 {LNG_entries}</option>
                </select>
              </span>
            </div>
            <div>
              <label for="wallet" data-i18n>{LNG_Wallet}</label>
              <span class="form-control icon-wallet">
                <select id="wallet" name="wallet">
                  <option value="" data-i18n>{LNG_all items}</option>
                </select>
              </span>
            </div>
            <div>
              <label for="tag" data-i18n>{LNG_Tag}</label>
              <span class="form-control icon-tags">
                <select id="tag" name="tag">
                  <option value="" data-i18n>{LNG_all items}</option>
                </select>
              </span>
            </div>
            <div>
              <label for="status" data-i18n>{LNG_Type}</label>
              <span class="form-control icon-filter">
                <select id="status" name="status">
                  <option value="" data-i18n>{LNG_all items}</option>
                </select>
              </span>
            </div>
            <div>
              <label for="from" data-i18n>{LNG_from}</label>
              <span class="form-control icon-calendar">
                <input type="date" id="from" name="from">
              </span>
            </div>
            <div>
              <label for="to" data-i18n>{LNG_to}</label>
              <span class="form-control icon-calendar">
                <input type="date" id="to" name="to">
              </span>
            </div>
            <input type="search" name="search" placeholder="{LNG_Search}...">
          </form>

          <div class="tablebody">
            <table class="table border fullwidth" data-table="omsinSearch" data-source="api/omsin/search" data-default-sort="create_date desc" data-page-size="30"
                   data-search-columns="comment" data-action-params="wallet,tag,status,from,to" data-show-checkbox="true" data-show-footer="true"
                   data-actions='{"delete":"Delete"}' data-action-url="api/omsin/search/action" data-row-actions='{
                      "edit": {
                        "title": "Edit",
                        "className": "btn btn-success icon-edit",
                        "condition": "editable == 1"
                      }
                    }'>
              <thead>
                <tr>
                  <th data-field="create_date_text" data-sort="create_date" class="nowrap" data-cell-class="nowrap" data-i18n>{LNG_Date}</th>
                  <th data-field="category_text" data-sort="category_id" data-cell-class="nowrap" data-i18n>{LNG_Tag}</th>
                  <th data-field="wallet_text" data-sort="wallet" data-cell-class="nowrap" data-i18n>{LNG_Wallet}</th>
                  <th data-field="comment" data-i18n>{LNG_Annotation}</th>
                  <th data-field="amount_text" data-sort="income" class="center" data-cell-class="right"
                      data-template="<span class='${amount_class}'>${amount_text}</span>" data-i18n>{LNG_Amount}</th>
                </tr>
              </thead>
              <tbody></tbody>
              <tfoot>
                <tr>
                  <td colspan="4" class="right" data-i18n>{LNG_Total}</td>
                  <td class="right" data-field="net" data-aggregate="sum" data-format="currency"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2026 Admin Framework - Powered by <a href="https://nowjs.net">Now.js</a></p>
  </footer>
</div>
