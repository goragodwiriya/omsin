<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <form data-form="omsinCategories" action="api/omsin/categories/save" method="post" data-ajax-submit="true" data-load-api="api/omsin/categories/get"
            data-load-query-params="true" data-confirm="Confirm save" autocomplete="off">
        <div class="card-groups">
          <header>
            <div>
              <h1 class="icon-category" data-text="title" data-i18n>{LNG_Category}</h1>
              <p data-i18n>{LNG_Details of}</p>
            </div>
          </header>
          <div class="content-body">
            <fieldset class="grid">
              <div class="tablebody">
                <table class="table border fullwidth" data-table="omsinCategories" data-editable-rows="true" data-attr="data:options" data-dynamic-columns="true">
                  <tbody></tbody>
                </table>
              </div>
            </fieldset>
            <fieldset class="submit">
              <button type="submit" class="btn btn-primary icon-save" data-i18n>{LNG_Save}</button>
              <input type="hidden" name="type" data-attr="value:type">
            </fieldset>
          </div>
        </div>
      </form>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2026 Admin Framework - Powered by <a href="https://nowjs.net">Now.js</a></p>
  </footer>
</div>
