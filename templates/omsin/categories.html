<form data-form="omsinCategories" action="api/omsin/categories/save" method="post" data-ajax-submit="true" data-load-api="api/omsin/categories/get"
      data-load-query-params="true" data-confirm="Confirm save" autocomplete="off">
  <div class="card-groups">
    <header>
      <div>
        <h1 class="icon-category" data-text="title" data-i18n>{LNG_Category}</h1>
        <p data-i18n>{LNG_Details of}</p>
      </div>
    </header>
    <div class="content-body">
      <fieldset class="grid">
        <div class="tablebody">
          <table class="table border fullwidth" data-table="omsinCategories" data-editable-rows="true" data-attr="data:options" data-url-params="false">
            <!-- คอลัมน์ของตารางแก้ไขอยู่ที่นี่ — API ส่งเฉพาะแถว -->
            <thead>
              <tr>
                <th data-field="id" data-cell-element="text" data-size="5" data-i18n>{LNG_ID}</th>
                <th data-field="topic" data-cell-element="text" data-size="30" data-i18n>{LNG_Detail}</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </fieldset>
      <fieldset class="submit">
        <button type="submit" class="btn btn-primary icon-save" data-i18n>{LNG_Save}</button>
        <input type="hidden" name="type" data-attr="value:type">
      </fieldset>
    </div>
  </div>
</form>
