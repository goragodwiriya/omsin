<div class="card-groups" data-component="api" data-endpoint="api/omsin/home">
  <header>
    <div>
      <h1 class="icon-pie" data-i18n>{LNG_Income and Expenditure summary}</h1>
      <p data-i18n>{LNG_Wallet}</p>
    </div>
    <div>
      <a class="btn btn-primary icon-billing" href="/omsin" data-i18n>{LNG_Recording} {LNG_Income}/{LNG_Expense}</a>
    </div>
  </header>
  <div class="ggrid">
    <div class="block6 stat-card positive">
      <div class="stat-header icon-money">
        <div class="stat-title" data-i18n>{LNG_Today&#039;s receipts}</div>
      </div>
      <div class="stat-value"><span data-text="today_income | number:2">0</span> <small data-text="unit"></small></div>
    </div>
    <div class="block6 stat-card negative">
      <div class="stat-header icon-money">
        <div class="stat-title" data-i18n>{LNG_Today&#039;s expenses}</div>
      </div>
      <div class="stat-value"><span data-text="today_expense | number:2">0</span> <small data-text="unit"></small></div>
    </div>
  </div>
  <section class="content-body">
    <header>
      <div>
        <h2 class="icon-wallet" data-i18n>{LNG_Wallet}</h2>
      </div>
    </header>
    <div data-if="!has_wallet">
      <p class="comment" data-i18n>{LNG_Sorry, no information available for this item.}</p>
    </div>
    <dl class="omsin-chart omsin-item-groups" data-for="item in wallets">
      <template>
        <dd class="omsin-item">
          <span class="omsin-label" data-text="item.topic"></span>
          <span class="omsin-bar" data-class="negative: item.negative, positive: !item.negative" data-style="width: {{item.pct}}%">
            <span data-text="item.money | number:2"></span><span data-text="unit"></span>
          </span>
        </dd>
      </template>
    </dl>
    <dl class="omsin-chart">
      <dd class="omsin-item">
        <span class="omsin-label" data-i18n>{LNG_Total}</span>
        <span class="omsin-bar total" data-style="width: {{total_pct}}%">
          <span data-text="total | number:2"></span><span data-text="unit"></span>
        </span>
      </dd>
    </dl>
  </section>
  <div class="ggrid">
    <div class="block6 stat-card positive">
      <div class="stat-header icon-summary">
        <div class="stat-title" data-i18n>{LNG_All receipts}</div>
      </div>
      <div class="stat-value"><span data-text="total_income | number:2">0</span> <small data-text="unit"></small></div>
    </div>
    <div class="block6 stat-card negative">
      <div class="stat-header icon-summary">
        <div class="stat-title" data-i18n>{LNG_All expenses}</div>
      </div>
      <div class="stat-value"><span data-text="total_expense | number:2">0</span> <small data-text="unit"></small></div>
    </div>
  </div>
</div>
